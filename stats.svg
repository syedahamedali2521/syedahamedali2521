<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Local animated GitHub statistics">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff4f9a"/><stop offset="1" stop-color="#9b5cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="520" height="300" rx="26" fill="#17091d" stroke="#ff4f9a" stroke-opacity=".35"/>
<text x="28" y="35" fill="#ff7db8" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">GITHUB PULSE</text>
<circle cx="105" cy="145" r="65" fill="none" stroke="#36213f" stroke-width="12"/>
<circle cx="105" cy="145" r="65" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="408" stroke-dashoffset="408" filter="url(#glow)">
 <animate attributeName="stroke-dashoffset" from="408" to="74" dur="1.6s" begin=".2s" fill="freeze"/>
 <animate attributeName="stroke-dashoffset" values="74;92;74" dur="3.2s" begin="2s" repeatCount="indefinite"/>
</circle>
<text x="105" y="139" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22" font-weight="700">A+</text>
<text x="105" y="160" text-anchor="middle" fill="#cdb7d1" font-family="ui-monospace,monospace" font-size="10">AI BUILDER</text>
<g font-family="ui-monospace,monospace">
<g transform="translate(205 75)" opacity="0"><text fill="#fff" font-size="24" font-weight="700">34</text><text x="45" y="0" fill="#bfa9c4" font-size="12">public repos</text><rect y="12" width="230" height="4" rx="2" fill="#302039"/><rect y="12" width="170" height="4" rx="2" fill="url(#g)"><animate attributeName="width" from="0" to="170" dur=".8s" begin=".7s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" dur=".6s" begin=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="30 75;0 75" dur=".6s" begin=".6s" fill="freeze"/></g>
<g transform="translate(205 130)" opacity="0"><text fill="#fff" font-size="24" font-weight="700">3</text><text x="45" y="0" fill="#bfa9c4" font-size="12">stars</text><rect y="12" width="230" height="4" rx="2" fill="#302039"/><rect y="12" width="85" height="4" rx="2" fill="#7ee7ff"><animate attributeName="width" from="0" to="85" dur=".8s" begin="1s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" dur=".6s" begin=".9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="30 130;0 130" dur=".6s" begin=".9s" fill="freeze"/></g>
<g transform="translate(205 185)" opacity="0"><text fill="#fff" font-size="24" font-weight="700">6</text><text x="45" y="0" fill="#bfa9c4" font-size="12">followers</text><rect y="12" width="230" height="4" rx="2" fill="#302039"/><rect y="12" width="110" height="4" rx="2" fill="#7df5c7"><animate attributeName="width" from="0" to="110" dur=".8s" begin="1.3s" fill="freeze"/></rect><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="30 185;0 185" dur=".6s" begin="1.2s" fill="freeze"/></g>
</g>
</svg>
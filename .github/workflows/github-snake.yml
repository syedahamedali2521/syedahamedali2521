name: Generate contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff4f9a&color_dots=%23f3e5ef,%23f7b3d0,%23ed8ab7,%23d95d9b,%23b83b7e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff4f9a&color_dots=%232b1b34,%235b244c,%238a2f64,%23b33c7d,%23ff4f9a

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
